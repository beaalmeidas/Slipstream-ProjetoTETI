services:
  - type: web
    name: slipstream-api
    env: node
    root: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: slipstream-db
          property: connectionString
      - key: NODE_ENV
        value: production
    healthCheckPath: /api/user/all

databases:
  - name: slipstream-db
    databaseName: slipstream_db
    plan: free 